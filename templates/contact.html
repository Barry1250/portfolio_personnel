<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }
        header {
            background-color: #6f42c1;
            color: white;
            padding: 3rem 1rem;
            text-align: center;
            border-bottom: 5px solid #5a32a3;
        }
        header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        header p { font-size: 1.2rem; }
        .contact-form {
            max-width: 600px;
            margin: 3rem auto;
            padding: 2rem;
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .contact-form h2 {
            color: #6f42c1;
            margin-bottom: 1rem;
            text-align: center;
        }
        .form-control { margin-bottom: 1rem; }
        .btn-custom {
            background-color: #6f42c1;
            color: white;
            font-weight: bold;
            padding: 0.5rem 1rem;
        }
        .btn-custom:hover { background-color: #5a32a3; }
        footer { text-align: center; padding: 2rem 0; color: #6c757d; margin-top: 3rem; }
    </style>
</head>
<body>

<header>
    <h1>Contactez-moi</h1>
    <p>Envoyez-moi un message pour vos projets ou collaborations</p>
</header>

<div class="contact-form">
    <h2>Formulaire de Contact</h2>
    <form method="get" action="">
        <input type="text" name="nom" placeholder="Votre nom" class="form-control" required>
        <input type="email" name="email" placeholder="Votre email" class="form-control" required>
        <textarea name="message" rows="5" placeholder="Votre message" class="form-control" required></textarea>
        <button type="submit" class="btn btn-custom">Envoyer</button>
    </form>
</div>

<footer>
    &copy; 2026 Barry1250
</footer>

</body>
</html>
